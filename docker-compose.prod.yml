name: collix

services:
  server:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/collix-server:${IMAGE_TAG:-latest}
    env_file:
      - ./.env.server
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - collix-network

  client:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/collix-client:${IMAGE_TAG:-latest}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - collix-network

networks:
  collix-network:
    driver: bridge