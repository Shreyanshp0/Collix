version: "3.9"

services:

  client:

    image: YOUR_DOCKERHUB_USERNAME/collix-client:latest

    container_name: collix-client

    restart: unless-stopped

    ports:

      - "80:80"

    depends_on:

      - server

  server:

    image: YOUR_DOCKERHUB_USERNAME/collix-server:latest

    container_name: collix-server

    restart: unless-stopped

    env_file:

      - ./Server/.env.production

    ports:

      - "5000:5000"